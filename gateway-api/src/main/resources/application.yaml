server:
  port: 8084

spring:
  application:
    name: gateway-api
  config:
    import: optional:configserver:http://external-config:8888

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      bankRestCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s